services:
  php:
    build:
      context: .
      target: frankenphp_prod
    image: emiliengibeaud/resa_table:latest
    container_name: resa_table
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      MAILER_DSN: ${MAILER_DSN}
      SERVER_NAME: ${SERVER_NAME}
      APP_BASE_URL: ${APP_BASE_URL}
      # Doctrine ORM → MariaDB
      DATABASE_URL: ${DATABASE_URL}
      # In production, DATABASE_URL is provided by .env.prod.local
      # through Docker Compose and injected into the PHP container.

    networks:
      - edge_edge
      - resa_table_internal

  database:
    image: mariadb:${MARIADB_VERSION}
    container_name: resa_table_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - resa_table_internal

networks:
  edge_edge:
    external: true
  resa_table_internal:
    name: resa_table_internal     # Create the network if it doesn't exist yet
    # external: true              # Create the network with "docker network create resa_table_internal"

volumes:
  mariadb_data:
